[project]
name = "pyrtms"
version = "0.5.6"
description = "A python package for reading Bruker MSI vendor files quickly. Initially translated from the R package 'rtms' at https://cran.r-project.org/web/packages/rtms/index.html"
readme = "README.md"
authors = [{ name="Weimin Liu", email="wliu@marum.de" }, { name="Yannick Zander", email="yzander@marum.de" }]
dependencies = [
    "numpy",
    "shiny",
    "pyopenms",
    "pandas",
    "matplotlib",
    "tqdm",
    "h5py"
    ]

[project.scripts]
rtms = "pyrtms.__main__:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
